DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguru - Deep Understanding Through Curiosity</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #1e40af 100%);
            min-height: 100vh;
            color: #1e293b;
        }

        #root {
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding-top: 30px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            letter-spacing: -1px;
        }

        .header .tagline {
            font-size: 1.4rem;
            opacity: 0.95;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-size: 1.05rem;
            opacity: 0.85;
            font-style: italic;
        }

        .main-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.4);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-section {
            padding: 50px;
            background: linear-gradient(to bottom, #f8fafc 0%, white 100%);
            border-bottom: 2px solid #e2e8f0;
        }

        .search-section h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #1e40af;
            text-align: center;
            font-weight: 700;
        }

        .search-container {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .topic-input {
            flex: 1;
            padding: 18px 28px;
            border: 3px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1.15rem;
            outline: none;
            transition: all 0.3s;
            background: white;
        }

        .topic-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .explore-button {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            border: none;
            padding: 18px 45px;
            border-radius: 16px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .explore-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
        }

        .explore-button:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .explore-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .example-topics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
        }

        .example-topic {
            background: white;
            padding: 18px 22px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            border: 2px solid #e2e8f0;
            font-size: 1rem;
            font-weight: 500;
            color: #334155;
        }

        .example-topic:hover {
            border-color: #3b82f6;
            background: #eff6ff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.2);
        }

        .content-section {
            padding: 50px;
        }

        .back-button {
            background: white;
            color: #1e40af;
            border: 2px solid #3b82f6;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 25px;
            display: inline-block;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .back-button:hover {
            background: #1e40af;
            color: white;
            transform: translateX(-3px);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #1e40af;
        }

        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid #e2e8f0;
            border-top: 5px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .lecture-container {
            background: #f8fafc;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 35px;
            line-height: 1.8;
            font-size: 1.1rem;
            color: #334155;
            border: 2px solid #e2e8f0;
        }

        .lecture-container h3 {
            color: #1e40af;
            font-size: 2rem;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 4px solid #3b82f6;
            font-weight: 800;
        }

        .lecture-container h4 {
            color: #1e40af;
            font-size: 1.5rem;
            margin-top: 30px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .lecture-container p {
            margin-bottom: 18px;
            line-height: 1.9;
        }

        .lecture-container ul, .lecture-container ol {
            margin-left: 30px;
            margin-bottom: 18px;
        }

        .lecture-container li {
            margin-bottom: 10px;
        }

        .lecture-container strong {
            color: #1e293b;
            font-weight: 700;
        }

        .lecture-container em {
            color: #475569;
            background: #fef3c7;
            padding: 3px 8px;
            border-radius: 4px;
            font-style: normal;
            font-weight: 600;
        }

        .understanding-prompt {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            font-size: 1.1rem;
            line-height: 1.7;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .understanding-prompt strong {
            display: block;
            margin-bottom: 12px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .qa-section {
            margin-top: 35px;
        }

        .qa-header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            padding: 24px;
            border-radius: 16px 16px 0 0;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .qa-messages {
            background: white;
            border: 2px solid #e2e8f0;
            border-top: none;
            border-radius: 0 0 16px 16px;
            max-height: 450px;
            overflow-y: auto;
            padding: 25px;
        }

        .qa-message {
            margin-bottom: 22px;
            animation: fadeIn 0.4s ease-in;
        }

        .qa-message.question {
            background: #dbeafe;
            padding: 15px 20px;
            border-radius: 12px;
            border-left: 5px solid #3b82f6;
        }

        .qa-message.answer {
            background: #f8fafc;
            padding: 15px 20px;
            border-radius: 12px;
            border-left: 5px solid #10b981;
            margin-left: 25px;
        }

        .qa-message strong {
            display: block;
            margin-bottom: 8px;
            color: #1e40af;
            font-weight: 700;
            font-size: 1.05rem;
        }

        .qa-message.answer strong {
            color: #059669;
        }

        .qa-input-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 16px;
        }

        .qa-input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.05rem;
            outline: none;
            transition: all 0.2s;
        }

        .qa-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .qa-button {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.05rem;
        }

        .qa-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .qa-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: #fef3c7;
            border: 3px solid #f59e0b;
            border-radius: 16px;
            padding: 25px;
            margin: 25px 0;
            color: #92400e;
        }

        .error-message strong {
            display: block;
            margin-bottom: 12px;
            font-size: 1.2rem;
            color: #b45309;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.8rem;
            }

            .search-container {
                flex-direction: column;
            }

            .example-topics {
                grid-template-columns: 1fr;
            }

            .qa-message.answer {
                margin-left: 0;
            }

            .search-section, .content-section {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const API_URL = 'https://nguru-production.up.railway.app';

        function App() {
            const [view, setView] = useState('search');
            const [topic, setTopic] = useState('');
            const [currentTopic, setCurrentTopic] = useState('');
            const [lecture, setLecture] = useState('');
            const [loading, setLoading] = useState(false);
            const [qaMessages, setQaMessages] = useState([]);
            const [question, setQuestion] = useState('');
            const [qaLoading, setQaLoading] = useState(false);
            const [error, setError] = useState('');
            const [userId] = useState(() => 'user_' + Math.random().toString(36).substr(2, 9));

            const exampleTopics = [
                "🚗 How does a car engine work?",
                "🌤️ Why is the sky blue?",
                "✈️ How do airplanes fly?",
                "⚡ How does electricity work?",
                "🌐 How does the internet work?",
                "💧 Why can't we use water as fuel?",
                "🧬 How does DNA replication work?",
                "🔋 How do batteries store energy?",
                "🌍 Why do we have seasons?",
                "🎵 How do speakers produce sound?"
            ];

            const exploreTopic = async (topicText) => {
                const topicToExplore = topicText || topic;
                if (!topicToExplore.trim()) return;

                setLoading(true);
                setError('');
                setCurrentTopic(topicToExplore);
                setView('content');
                setQaMessages([]);

                try {
                    const response = await fetch(`${API_URL}/api/lecture`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            topic: topicToExplore,
                            userId: userId
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to generate lecture');
                    }

                    const data = await response.json();
                    setLecture(data.lecture);
                } catch (err) {
                    console.error('Error:', err);
                    setError('Connection failed. Please check your internet connection and try again.');
                } finally {
                    setLoading(false);
                }
            };

            const askQuestion = async () => {
                if (!question.trim()) return;

                const currentQuestion = question;
                setQuestion('');
                setQaLoading(true);

                setQaMessages(prev => [...prev, {
                    type: 'question',
                    content: currentQuestion
                }]);

                try {
                    const response = await fetch(`${API_URL}/api/question`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            question: currentQuestion,
                            userId: userId,
                            topic: currentTopic
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to get answer');
                    }

                    const data = await response.json();
                    setQaMessages(prev => [...prev, {
                        type: 'answer',
                        content: data.answer
                    }]);
                } catch (err) {
                    console.error('Error:', err);
                    setQaMessages(prev => [...prev, {
                        type: 'answer',
                        content: 'Sorry, I had trouble answering. Please try again.'
                    }]);
                } finally {
                    setQaLoading(false);
                }
            };

            const goBack = () => {
                setView('search');
                setTopic('');
                setLecture('');
                setQaMessages([]);
                setError('');
            };

            return (
                <div className="container">
                    <div className="header">
                        <div className="logo-container">
                            <svg className="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                                <path d="M40,100 Q70,40 100,100 T160,100" stroke="#1e40af" strokeWidth="12" fill="none"/>
                                <path d="M160,100 Q130,160 100,100 T40,100" stroke="#1e40af" strokeWidth="12" fill="none"/>
                            </svg>
                        </div>
                        <h1>Nguru</h1>
                        <p className="tagline">Deep Understanding Through Curiosity</p>
                        <p className="subtitle">Real knowledge, not illusions. Understand from the fundamentals.</p>
                    </div>

                    <div className="main-card">
                        {view === 'search' ? (
                            <div className="search-section">
                                <h2>What do you want to truly understand?</h2>
                                
                                <div className="search-container">
                                    <input 
                                        type="text"
                                        className="topic-input"
                                        placeholder="Ask anything... How does a car work? Why is the sky blue?"
                                        value={topic}
                                        onChange={(e) => setTopic(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && exploreTopic()}
                                    />
                                    <button 
                                        className="explore-button"
                                        onClick={() => exploreTopic()}
                                        disabled={loading}
                                    >
                                        Explore
                                    </button>
                                </div>

                                <div className="example-topics">
                                    {exampleTopics.map((topic, idx) => (
                                        <div 
                                            key={idx}
                                            className="example-topic"
                                            onClick={() => {
                                                const cleanTopic = topic.replace(/^[^\s]+\s/, '');
                                                setTopic(cleanTopic);
                                                exploreTopic(cleanTopic);
                                            }}
                                        >
                                            {topic}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="content-section">
                                <button className="back-button" onClick={goBack}>
                                    ← Back to Search
                                </button>

                                {loading ? (
                                    <div className="loading">
                                        <div className="loading-spinner"></div>
                                        <p>Preparing your comprehensive lecture...</p>
                                    </div>
